<!-- Explanation report and Q&A chat component -->
<div class="report-viewer">
  <div class="workspace-header">
    <h2 data-i18n="explain_title">Explain — Codebase Analysis</h2>
    <div class="explain-actions">
      <button class="btn btn-primary" id="build-index-btn" data-i18n="build_index_btn">⚙ Build index</button>
      <button class="btn btn-secondary" id="migrate-vector-btn" disabled data-i18n="rag_migrate_btn">
        ⬡ RAG migration
      </button>
      <button class="btn btn-secondary" id="generate-report-btn" disabled data-i18n="gen_report_btn">
        ✦ Generate report
      </button>
      <button class="btn btn-secondary" id="report-history-btn" disabled data-i18n="history_btn">
        🕐 History
      </button>
    </div>
  </div>

  <!-- Index progress bar (sticky) -->
  <div class="index-progress-container sticky-progress" id="index-progress-container" style="display:none;">
    <div class="progress-row">
      <span id="index-progress-label" data-i18n="indexing_label">Building index…</span>
      <progress id="index-progress" max="100" value="0"></progress>
    </div>
  </div>

  <!-- Partial report banner -->
  <div id="report-partial-banner" class="report-partial-banner" style="display:none;">
    <span id="report-partial-text"></span>
    <div class="report-partial-actions">
      <button class="btn btn-sm btn-primary" id="report-resume-btn">▶ Resume</button>
      <button class="btn btn-sm btn-secondary" id="report-regen-btn">↺ Regenerate</button>
      <button class="btn btn-sm btn-ghost" id="report-partial-dismiss">✕</button>
    </div>
  </div>

  <!-- Section selector panel -->
  <details id="section-selector-panel" class="section-selector-panel" style="display:none;">
    <summary class="section-selector-summary">
      <span data-i18n="select_sections_summary">📋 Select sections to generate</span>
      <span id="section-selector-count" class="section-count-badge"></span>
    </summary>
    <div class="section-selector-body">
      <div class="section-selector-controls">
        <button class="btn btn-sm btn-ghost" id="sections-select-all" data-i18n="select_all_btn">Select all</button>
        <button class="btn btn-sm btn-ghost" id="sections-deselect-all" data-i18n="deselect_all_btn">Deselect all</button>
        <label class="section-model-label">
          <span data-i18n="language_label">Language:</span>
          <select id="report-language-select" class="report-model-select">
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="it">Italiano</option>
          </select>
        </label>
        <label class="section-model-label">
          <span data-i18n="model_override_label">Model:</span>
          <select id="report-model-override" class="report-model-select">
            <option value="" data-i18n="model_project_default">Use project setting</option>
          </select>
        </label>
      </div>
      <div id="section-checkboxes" class="section-checkboxes"></div>
    </div>
  </details>

  <!-- Report output area -->
  <div class="report-output" id="report-output">
    <div class="empty-state report-empty">
      <p data-i18n="report_empty_p">Run "Build index" then generate a report.</p>
    </div>
  </div>

  <!-- History panel (slide-in) -->
  <div id="report-history-panel" class="report-history-panel" style="display:none;">
    <div class="history-panel-header">
      <h3 data-i18n="report_history_h3">Report history</h3>
      <button class="btn btn-sm btn-ghost" id="history-panel-close" data-i18n="history_close_btn">✕</button>
    </div>
    <div id="history-panel-list" class="history-panel-list">
      <p class="history-empty" data-i18n="history_empty_p">No history.</p>
    </div>
    <div class="history-panel-footer">
      <button class="btn btn-sm btn-secondary" id="history-compare-btn" disabled data-i18n="history_compare_btn">⇆ Compare selected (2)</button>
    </div>
  </div>

  <!-- Compare view -->
  <div id="report-compare-view" class="report-compare-view" style="display:none;">
    <div class="compare-header">
      <h3 data-i18n="report_compare_h3">Report comparison</h3>
      <div class="compare-nav">
        <label>
          <span data-i18n="compare_section_label">Section:</span>
          <select id="compare-section-select" class="compare-section-select"></select>
        </label>
      </div>
      <button class="btn btn-sm btn-ghost" id="compare-close-btn" data-i18n="compare_close_btn">✕ Close</button>
    </div>
    <div class="compare-columns">
      <div class="compare-col">
        <div class="compare-col-header" id="compare-col-a-title">Report A</div>
        <div class="compare-col-body md-body" id="compare-col-a"></div>
      </div>
      <div class="compare-divider"></div>
      <div class="compare-col">
        <div class="compare-col-header" id="compare-col-b-title">Report B</div>
        <div class="compare-col-body md-body" id="compare-col-b"></div>
      </div>
    </div>
  </div>

  <!-- Q&A chat area (activated after report is complete) -->
  <div class="chat-section" id="chat-section">
    <div class="chat-divider">
      <span data-i18n="qa_chat_span">Q&amp;A Chat</span>
    </div>
    <div class="chat-history" id="chat-history"></div>
    <div class="chat-mode-row">
      <div class="chat-mode-toggle" id="chat-mode-toggle">
        <button class="chat-mode-btn active" id="chat-mode-ultra" type="button" data-i18n="ultra_mode_btn">⚡⚡ Ultra</button>
        <button class="chat-mode-btn" id="chat-mode-fast" type="button" data-i18n="fast_mode_btn">⚡ Fast</button>
        <button class="chat-mode-btn" id="chat-mode-precise" type="button" data-i18n="precise_mode_btn">🎯 Precise</button>
      </div>
    </div>
    <div class="chat-input-row">
      <input
        type="text"
        id="chat-input"
        class="chat-input"
        data-i18n-placeholder="chat_placeholder"
        disabled
      >
      <button class="btn btn-primary" id="chat-send" disabled data-i18n="send_btn">Send ↵</button>
    </div>
  </div>
</div>
