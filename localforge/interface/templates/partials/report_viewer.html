<!-- 説明レポートとQ&Aチャットコンポーネント -->
<div class="report-viewer">
  <div class="workspace-header">
    <h2>Explain — コードベース分析</h2>
    <div class="explain-actions">
      <button class="btn btn-primary" id="build-index-btn">⚙ インデックス構築</button>
      <button class="btn btn-secondary" id="migrate-vector-btn" disabled title="既存インデックスをRAGベクトル検索に移行する">
        ⬡ RAG移行
      </button>
      <button class="btn btn-secondary" id="generate-report-btn" disabled>
        ✦ レポート生成
      </button>
      <button class="btn btn-secondary" id="report-history-btn" disabled title="過去のレポート履歴">
        🕐 履歴
      </button>
    </div>
  </div>

  <!-- インデックス進捗バー（sticky） -->
  <div class="index-progress-container sticky-progress" id="index-progress-container" style="display:none;">
    <div class="progress-row">
      <span id="index-progress-label">インデックス構築中...</span>
      <progress id="index-progress" max="100" value="0"></progress>
    </div>
  </div>

  <!-- 部分レポートバナー -->
  <div id="report-partial-banner" class="report-partial-banner" style="display:none;">
    <span id="report-partial-text"></span>
    <div class="report-partial-actions">
      <button class="btn btn-sm btn-primary" id="report-resume-btn">▶ 続きから生成</button>
      <button class="btn btn-sm btn-secondary" id="report-regen-btn">↺ 最初から再生成</button>
      <button class="btn btn-sm btn-ghost" id="report-partial-dismiss">✕</button>
    </div>
  </div>

  <!-- セクション選択パネル -->
  <details id="section-selector-panel" class="section-selector-panel" style="display:none;">
    <summary class="section-selector-summary">
      <span>📋 生成するセクションを選択</span>
      <span id="section-selector-count" class="section-count-badge"></span>
    </summary>
    <div class="section-selector-body">
      <div class="section-selector-controls">
        <button class="btn btn-sm btn-ghost" id="sections-select-all">すべて選択</button>
        <button class="btn btn-sm btn-ghost" id="sections-deselect-all">すべて解除</button>
        <label class="section-model-label">言語:
          <select id="report-language-select" class="report-model-select">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="section-model-label">モデル:
          <select id="report-model-override" class="report-model-select">
            <option value="">プロジェクト設定を使用</option>
          </select>
        </label>
      </div>
      <div id="section-checkboxes" class="section-checkboxes"></div>
    </div>
  </details>

  <!-- レポート出力エリア -->
  <div class="report-output" id="report-output">
    <div class="empty-state report-empty">
      <p>「インデックス構築」を実行してからレポートを生成してください。</p>
    </div>
  </div>

  <!-- 履歴パネル（スライドイン） -->
  <div id="report-history-panel" class="report-history-panel" style="display:none;">
    <div class="history-panel-header">
      <h3>レポート履歴</h3>
      <button class="btn btn-sm btn-ghost" id="history-panel-close">✕</button>
    </div>
    <div id="history-panel-list" class="history-panel-list">
      <p class="history-empty">履歴がありません。</p>
    </div>
    <div class="history-panel-footer">
      <button class="btn btn-sm btn-secondary" id="history-compare-btn" disabled>⇆ 選択した2件を比較</button>
    </div>
  </div>

  <!-- 比較ビュー -->
  <div id="report-compare-view" class="report-compare-view" style="display:none;">
    <div class="compare-header">
      <h3>レポート比較</h3>
      <div class="compare-nav">
        <label>セクション:
          <select id="compare-section-select" class="compare-section-select"></select>
        </label>
      </div>
      <button class="btn btn-sm btn-ghost" id="compare-close-btn">✕ 閉じる</button>
    </div>
    <div class="compare-columns">
      <div class="compare-col">
        <div class="compare-col-header" id="compare-col-a-title">レポートA</div>
        <div class="compare-col-body md-body" id="compare-col-a"></div>
      </div>
      <div class="compare-divider"></div>
      <div class="compare-col">
        <div class="compare-col-header" id="compare-col-b-title">レポートB</div>
        <div class="compare-col-body md-body" id="compare-col-b"></div>
      </div>
    </div>
  </div>

  <!-- Q&Aチャットエリア（レポート完了後に有効化） -->
  <div class="chat-section" id="chat-section">
    <div class="chat-divider">
      <span>Q&amp;A チャット</span>
    </div>
    <div class="chat-history" id="chat-history"></div>
    <div class="chat-mode-row">
      <div class="chat-mode-toggle" id="chat-mode-toggle" title="高速モード: BFS展開・サマリー省略で素早く回答 / 精密モード: 依存関係展開・フルコンテキストで詳細に回答">
        <button class="chat-mode-btn active" id="chat-mode-fast" type="button">⚡ 高速</button>
        <button class="chat-mode-btn" id="chat-mode-precise" type="button">🎯 精密</button>
      </div>
    </div>
    <div class="chat-input-row">
      <input
        type="text"
        id="chat-input"
        class="chat-input"
        placeholder="このプロジェクトについて質問してください..."
        disabled
      >
      <button class="btn btn-primary" id="chat-send" disabled>送信 ↵</button>
    </div>
  </div>
</div>
