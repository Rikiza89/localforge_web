<!-- Plan generation & approval UI component -->
<div class="plan-viewer">
  <div class="workspace-header">
    <h2 data-i18n="generate_title">Generate — Create &amp; Improve Project</h2>
  </div>

  <!-- Saved plan banner -->
  <div class="saved-plan-banner" id="saved-plan-banner" style="display:none;">
    <div class="saved-plan-banner-body">
      <span id="saved-plan-banner-text" data-i18n="saved_plan_banner_text">Saved plan loaded. Approve to continue or enter a new prompt.</span>
      <div class="saved-plan-banner-actions" id="saved-plan-banner-actions" style="display:none;">
        <button class="btn btn-primary btn-sm" id="resume-generation-btn" data-i18n="resume_gen_btn">↺ Resume from last point</button>
        <button class="btn btn-secondary btn-sm" id="restart-generation-btn" data-i18n="restart_gen_btn">▶ Start generation</button>
      </div>
    </div>
    <button class="btn-link" id="dismiss-plan-banner-btn" data-i18n="dismiss_banner_btn">✕ Close</button>
  </div>

  <!-- Prompt input area -->
  <div class="prompt-section">
    <label for="generate-prompt" class="field-label" data-i18n="prompt_label">Project description / improvement request</label>
    <textarea
      id="generate-prompt"
      class="prompt-input"
      data-i18n-placeholder="prompt_placeholder"
      rows="5"
    ></textarea>
    <div class="plan-file-count-row">
      <label class="file-count-label">
        <span data-i18n="min_files_label">Min files</span>
        <input type="number" id="plan-min-files" class="file-count-input"
               min="1" max="200" data-i18n-placeholder="no_limit_placeholder">
      </label>
      <label class="file-count-label">
        <span data-i18n="max_files_label">Max files</span>
        <input type="number" id="plan-max-files" class="file-count-input"
               min="1" max="200" data-i18n-placeholder="no_limit_placeholder">
      </label>
    </div>
    <div class="prompt-actions">
      <button class="btn btn-primary" id="generate-plan-btn" data-i18n="generate_plan_btn">
        ✦ Generate plan
      </button>
    </div>
  </div>

  <!-- Plan display & edit area -->
  <div class="plan-section" id="plan-section" style="display:none;">
    <div class="plan-header">
      <h3 data-i18n="generated_plan_h3">Generated plan</h3>
      <div class="plan-actions">
        <label class="branch-toggle-label">
          <input type="checkbox" id="gen-branch-toggle">
          <span data-i18n="new_branch_label">Generate on new branch</span>
        </label>
        <button class="btn btn-primary" id="approve-plan-btn" data-i18n="approve_btn">✓ Approve &amp; start generation</button>
        <button class="btn btn-secondary" id="edit-plan-btn" data-i18n="edit_plan_btn">✎ Edit</button>
        <button class="btn btn-secondary" id="reprompt-btn" data-i18n="reprompt_btn">↺ Re-prompt</button>
      </div>
    </div>

    <!-- AI plan summary (Markdown rendered) -->
    <div class="plan-summary md-body" id="plan-summary" style="display:none;"></div>

    <!-- Plan visual tree (with NEW/EDIT badges) -->
    <div class="plan-tree" id="plan-tree"></div>

    <!-- Editable raw JSON textarea -->
    <div class="plan-json-editor" id="plan-json-editor" style="display:none;">
      <label class="field-label" data-i18n="plan_json_label">Plan JSON (directly editable)</label>
      <textarea id="plan-json-textarea" class="json-textarea" rows="20" spellcheck="false"></textarea>
      <div class="json-editor-actions">
        <button class="btn btn-primary" id="apply-json-btn" data-i18n="json_apply_btn">Apply</button>
        <button class="btn btn-secondary" id="cancel-edit-btn" data-i18n="json_cancel_btn">Cancel</button>
      </div>
    </div>

    <!-- Plan stream output (during generation) -->
    <pre class="stream-output" id="plan-stream-output" style="display:none;"></pre>
  </div>

  <!-- File generation area -->
  <div class="generation-section" id="generation-section" style="display:none;">
    <div class="generation-header">
      <h3 data-i18n="generating_h3">Generating files…</h3>
      <button class="btn btn-danger" id="cancel-generation-btn" data-i18n="cancel_gen_btn">✕ Cancel</button>
    </div>
    <div class="progress-container">
      <progress id="generation-progress" max="100" value="0"></progress>
      <span class="progress-label" id="progress-label" data-i18n="preparing_label">Preparing…</span>
    </div>
    <div class="stream-output-container">
      <div class="gen-file-header" id="gen-current-file-header" style="display:none;"></div>
      <pre class="stream-output" id="generation-stream-output"></pre>
    </div>
  </div>
</div>
