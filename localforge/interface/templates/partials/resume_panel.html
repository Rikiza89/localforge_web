<!-- Resume state panel component -->
<div class="resume-panel">
  <div class="workspace-header">
    <h2 data-i18n="resume_title">Resume — Continue Project</h2>
  </div>

  <!-- No-project message -->
  <div id="resume-empty" class="empty-state">
    <p data-i18n="resume_empty_p">Open a folder to select a resumable project.</p>
  </div>

  <!-- Resume state details -->
  <div id="resume-content" style="display:none;">

    <!-- Summary card -->
    <div class="resume-summary-card" id="resume-summary-card">
      <div class="summary-row">
        <span class="summary-label" data-i18n="last_commit_label">Last commit:</span>
        <span class="summary-value" id="last-commit-msg">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label" data-i18n="progress_label">Progress:</span>
        <span class="summary-value" id="resume-progress-text" data-i18n="files_progress_text">0 / 0 files</span>
      </div>
      <div class="progress-container">
        <progress id="resume-progress-bar" max="100" value="0"></progress>
      </div>
    </div>

    <!-- LocalForge project buttons -->
    <div class="resume-actions" id="resume-lf-actions" style="display:none;">
      <button class="btn btn-primary" id="continue-generation-btn" data-i18n="continue_gen_btn">
        ▶ Continue generation
      </button>
      <button class="btn btn-secondary" id="modify-plan-btn" data-i18n="modify_plan_btn">
        ✎ Modify plan
      </button>
    </div>

    <!-- Foreign project buttons -->
    <div class="resume-actions" id="resume-foreign-actions" style="display:none;">
      <button class="btn btn-primary" id="view-full-report-btn" data-i18n="view_report_btn">
        📄 Full report
      </button>
      <button class="btn btn-secondary" id="continue-qa-btn" data-i18n="continue_qa_btn">
        💬 Continue Q&amp;A
      </button>
      <button class="btn btn-secondary" id="generate-new-files-btn" data-i18n="gen_new_files_btn">
        ✦ Generate new files
      </button>
    </div>

    <!-- File status table -->
    <div class="resume-file-table-container">
      <table class="resume-file-table">
        <thead>
          <tr>
            <th data-i18n="status_col_th">Status</th>
            <th data-i18n="filepath_col_th">File path</th>
          </tr>
        </thead>
        <tbody id="resume-file-table-body">
        </tbody>
      </table>
    </div>

    <!-- Generation progress (on resume) -->
    <div class="resume-generation-section" id="resume-generation-section" style="display:none;">
      <div class="generation-header">
        <h3 data-i18n="resuming_h3">Resuming…</h3>
        <button class="btn btn-danger" id="resume-cancel-btn" data-i18n="resume_cancel_btn">✕ Cancel</button>
      </div>
      <div class="progress-container">
        <progress id="resume-gen-progress" max="100" value="0"></progress>
        <span class="progress-label" id="resume-gen-progress-label" data-i18n="preparing_label">Preparing…</span>
      </div>
      <pre class="stream-output" id="resume-stream-output"></pre>
    </div>

  </div>
</div>
