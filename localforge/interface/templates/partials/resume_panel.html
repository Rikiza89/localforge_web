<!-- 再開状態パネルコンポーネント -->
<div class="resume-panel">
  <div class="workspace-header">
    <h2>Resume — プロジェクトを再開</h2>
  </div>

  <!-- 未プロジェクト時のメッセージ -->
  <div id="resume-empty" class="empty-state">
    <p>フォルダを開いて再開可能なプロジェクトを選択してください。</p>
  </div>

  <!-- 再開状態の詳細 -->
  <div id="resume-content" style="display:none;">

    <!-- サマリーカード -->
    <div class="resume-summary-card" id="resume-summary-card">
      <div class="summary-row">
        <span class="summary-label">最終コミット:</span>
        <span class="summary-value" id="last-commit-msg">—</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">進行状況:</span>
        <span class="summary-value" id="resume-progress-text">0 / 0 ファイル</span>
      </div>
      <div class="progress-container">
        <progress id="resume-progress-bar" max="100" value="0"></progress>
      </div>
    </div>

    <!-- LocalForgeプロジェクト用ボタン -->
    <div class="resume-actions" id="resume-lf-actions" style="display:none;">
      <button class="btn btn-primary" id="continue-generation-btn">
        ▶ 生成を続行
      </button>
      <button class="btn btn-secondary" id="modify-plan-btn">
        ✎ プランを変更
      </button>
    </div>

    <!-- 外部プロジェクト用ボタン -->
    <div class="resume-actions" id="resume-foreign-actions" style="display:none;">
      <button class="btn btn-primary" id="view-full-report-btn">
        📄 フルレポートを表示
      </button>
      <button class="btn btn-secondary" id="continue-qa-btn">
        💬 Q&Aを続ける
      </button>
      <button class="btn btn-secondary" id="generate-new-files-btn">
        ✦ 新しいファイルを生成
      </button>
    </div>

    <!-- ファイル状態テーブル -->
    <div class="resume-file-table-container">
      <table class="resume-file-table">
        <thead>
          <tr>
            <th>状態</th>
            <th>ファイルパス</th>
          </tr>
        </thead>
        <tbody id="resume-file-table-body">
        </tbody>
      </table>
    </div>

    <!-- 生成進捗（再開時） -->
    <div class="resume-generation-section" id="resume-generation-section" style="display:none;">
      <div class="generation-header">
        <h3>生成再開中...</h3>
        <button class="btn btn-danger" id="resume-cancel-btn">✕ キャンセル</button>
      </div>
      <div class="progress-container">
        <progress id="resume-gen-progress" max="100" value="0"></progress>
        <span class="progress-label" id="resume-gen-progress-label">準備中...</span>
      </div>
      <pre class="stream-output" id="resume-stream-output"></pre>
    </div>

  </div>
</div>
